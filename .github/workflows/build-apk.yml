name: Build NzTools APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=NZTOOLS_API_URL=https://nztools-api.de.deplexo.com

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NzTools-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
